<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLE 双电机控制</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>双电机蓝牙控制</h1>
        <p id="deviceLabel">请选择 BLE 串口模块</p>
      </div>
      <div class="connection-area">
        <span id="connectionStatus" class="status status-offline">未连接</span>
        <button id="connectButton" class="button button-primary" type="button">连接设备</button>
      </div>
    </header>

    <section class="motor-grid" aria-label="电机控制">
      <article class="motor-panel">
        <div class="panel-heading">
          <h2>电机 1</h2>
          <span class="address">地址 1</span>
        </div>
        <dl class="reading-list">
          <div>
            <dt>实际角度</dt>
            <dd id="actual1">--.-°</dd>
          </div>
          <div>
            <dt>当前目标</dt>
            <dd id="target1">0.0°</dd>
          </div>
        </dl>
        <label class="field-label" for="angle1">设置角度</label>
        <div class="angle-field">
          <input id="angle1" type="number" min="-360" max="360" step="0.1" value="30.0">
          <span>°</span>
        </div>
      </article>

      <article class="motor-panel">
        <div class="panel-heading">
          <h2>电机 2</h2>
          <span class="address">地址 2</span>
        </div>
        <dl class="reading-list">
          <div>
            <dt>实际角度</dt>
            <dd id="actual2">--.-°</dd>
          </div>
          <div>
            <dt>当前目标</dt>
            <dd id="target2">0.0°</dd>
          </div>
        </dl>
        <label class="field-label" for="angle2">设置角度</label>
        <div class="angle-field">
          <input id="angle2" type="number" min="-360" max="360" step="0.1" value="30.0">
          <span>°</span>
        </div>
      </article>
    </section>

    <section class="command-bar" aria-label="运动命令">
      <button id="sendButton" class="button button-primary" type="button" disabled>同步转到目标角度</button>
      <button id="plusButton" class="button" type="button" disabled>两台目标 +30°</button>
      <button id="zeroButton" class="button" type="button" disabled>两台转到 0°</button>
    </section>

    <section class="controller-row">
      <span>控制器状态</span>
      <strong id="controllerState">--</strong>
      <span id="commandState" class="command-state">等待连接</span>
    </section>

    <section class="serial-debug" aria-label="蓝牙串口诊断">
      <span>蓝牙接收</span>
      <strong id="bluetoothDebug">BT --　LAST --　ERR --　RX --　SR ----</strong>
    </section>

    <section class="log-section">
      <div class="section-heading">
        <h2>通信记录</h2>
        <button id="clearLogButton" class="text-button" type="button">清空</button>
      </div>
      <pre id="communicationLog" aria-live="polite"></pre>
    </section>
  </main>

  <script src="app.js?v=20260727-2215"></script>
</body>
</html>
